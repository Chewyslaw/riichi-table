# Render Blueprint — deploys Riichi Table as a free web service with HTTPS at a fixed URL.
# In Render: New → Blueprint → pick this repo → Apply. The service URL is https://<name>.onrender.com
services:
  - type: web
    name: riichi-table
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.23.4"   # October 2026 security release (CVE-2026-111497 Brotli RCE and 9 others); keep at or above this
      - key: NODE_ENV
        value: production
      - key: ROOM_SECRET
        generateValue: true   # stable across deploys, so saved games can be restored after a restart
